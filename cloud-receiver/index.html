<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QRデータ受信管理</title><link rel="stylesheet" href="../receiver/style.css"></head><body><main class="app"><h1>QRデータ受信管理</h1><section class="panel"><label>受信側ログインメール<input id="email" type="email"></label><label>パスワード<input id="password" type="password"></label><button id="login">ログイン</button><button id="logout">ログアウト</button><button id="refresh">未受信一覧を更新</button><p id="status" role="status"></p></section><section class="panel"><h2>未受信ファイル</h2><div id="list"></div></section><section class="panel"><h2>取得ファイルの復号</h2><p>ファイルを取得後、従来の復号ページで復号してCSVを保存してください。</p><a href="../receiver/" target="_blank" rel="noopener">復号ページを開く</a><p>CSVを確実に保存した後でのみ「受信完了・削除」を押してください。</p></section></main><script type="module" src="app.js"></script></body></html>
